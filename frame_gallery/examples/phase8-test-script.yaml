alias: Frame Gallery Test New Artwork
description: Separate Green test. The app ends its own loading timer after cleanup; expiry is the fail-safe.
mode: single
sequence:
  - condition: state
    entity_id: timer.frame_gallery_test_run
    state: idle
  - action: timer.start
    target:
      entity_id: timer.frame_gallery_test_run
    data:
      duration: "00:02:30"
  - action: hassio.app_start
    data:
      app: local_frame_gallery_dev
    continue_on_error: true
  - wait_template: "{{ not is_state('timer.frame_gallery_test_run', 'active') }}"
    timeout: "00:02:30"
    continue_on_timeout: true
  - delay: "00:00:04"
