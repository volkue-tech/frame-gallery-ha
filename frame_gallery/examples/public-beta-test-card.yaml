type: vertical-stack
cards:
  - type: picture-entity
    entity: camera.frame_gallery_test_preview
    name: Neues Kunstwerk laden · Öffentliche Beta
    show_state: false
    show_name: true
    camera_view: auto
    aspect_ratio: "16:9"
    tap_action:
      action: perform-action
      perform_action: script.turn_on
      target:
        entity_id: script.frame_gallery_beta_new_artwork
    hold_action:
      action: more-info
  - type: conditional
    conditions:
      - condition: state
        entity: timer.frame_gallery_beta_run
        state: active
    card:
      type: markdown
      content: Kunstwerk wird geladen …
