# Generated by scripts/app_config.py; do not edit (D-123, D-129).
configuration:
  tv_host:
    name: 'Adresse du téléviseur'
    description: 'Adresse IPv4 privée de votre Frame TV, par exemple 192.168.1.20. Réservez cette adresse dans votre routeur. Les noms de machine et les adresses publiques ne sont pas acceptés.'
  source:
    name: 'Source des œuvres'
    description: 'wikimedia_commons (par défaut lors d''une nouvelle installation) : 1000 œuvres sélectionnées au format presque 16:9, sans clé API. art_institute_chicago : Art Institute of Chicago. cleveland_museum_of_art : Cleveland Museum of Art. local_media : vos fichiers JPEG/PNG dans frame_gallery/library, dans les médias Home Assistant.'
  color:
    name: 'Couleur souhaitée (Commons)'
    description: 'any signifie toutes les couleurs. Choisissez une famille présente sur une partie visible de l''œuvre (environ 5 %), pas nécessairement dominante. Les valeurs restent en anglais : Red rouge, Orange orange, Yellow jaune, Green vert, Blue bleu, Purple violet, Pink rose, Brown brun, Beige beige, Gray gris, Black noir, White blanc. Les autres sources ignorent ce filtre et le signalent dans le journal. Sans résultat, l''œuvre actuelle reste affichée.'
  artist:
    name: 'Artiste souhaité (Commons, facultatif)'
    description: 'Laissez vide ou saisissez All artists pour toute la sélection. Sinon, copiez un nom proposé dans le guide des artistes, par exemple Wassily Kandinsky. Uniquement pour Commons. L''artiste et la couleur doivent tous deux correspondre ; sans résultat, l''œuvre actuelle reste affichée, sans substitution d''artiste.'
  landscape_only:
    name: 'Format paysage uniquement'
    description: 'Sélectionne seulement les images plus larges que hautes. Recommandé pour un téléviseur horizontal.'
  strict_tv_format:
    name: 'Préférer le format 16:9 (peut prendre plus de temps)'
    description: 'Préfère les œuvres à environ 1 % du format 16:9. Sans résultat, avec le format paysage et contain, une autre œuvre paysage est affichée entière avec des marges. La sélection Commons est à moins de 2,5 % du 16:9 ; désactivez cette préférence pour inclure toute la sélection.'
  fit_mode:
    name: 'Ajustement de l''image (contain = sans recadrage)'
    description: 'contain affiche toute l''œuvre, avec des marges si nécessaire, sans la recadrer. cover remplit l''écran et peut couper les bords.'
  department:
    name: 'Département (Cleveland uniquement)'
    description: 'Sélectionne un département du Cleveland Museum of Art ; any signifie aucun filtre. Les autres sources ne prennent pas en charge ce filtre et le signalent dans le journal et le compte rendu du lancement.'
  style:
    name: 'Période (les deux musées)'
    description: 'Sélectionne la période de création : avant 1400, 1400 à 1599, 1600 à 1799, 1800 à 1899, ou depuis 1900. any signifie aucun filtre. Uniquement pour les deux musées, pas pour Commons ni vos fichiers. Les styles artistiques ne sont pas proposés.'
  background_color:
    name: 'Couleur des marges'
    description: 'Couleur des marges en mode contain, au format #RRGGBB. Le noir est #000000.'
  source_helper:
    name: 'Source depuis le tableau de bord (facultatif)'
    description: 'Identifiant d''une entrée input_select, select ou input_text, par exemple input_select.frame_gallery_source. Sa valeur remplace la source enregistrée à chaque lancement. Une valeur invalide ou indisponible utilise la source enregistrée, avec un avertissement. Laissez vide pour ne pas utiliser cette option.'
  department_helper:
    name: 'Département depuis le tableau de bord (facultatif)'
    description: 'Identifiant d''une entrée input_select, select ou input_text, par exemple input_select.frame_gallery_department. Sa valeur remplace le département enregistré à chaque lancement. Une valeur invalide ou indisponible utilise le réglage enregistré, avec un avertissement. Laissez vide pour ne pas utiliser cette option.'
  style_helper:
    name: 'Période depuis le tableau de bord (facultatif)'
    description: 'Identifiant d''une entrée input_select, select ou input_text, par exemple input_select.frame_gallery_period. Sa valeur remplace la période enregistrée à chaque lancement. Une valeur invalide ou indisponible utilise le réglage enregistré, avec un avertissement. Laissez vide pour ne pas utiliser cette option.'
  color_helper:
    name: 'Couleur depuis le tableau de bord (facultatif, Commons)'
    description: 'Identifiant d''une entrée input_select, select ou input_text, par exemple input_select.frame_gallery_colour. Sa valeur remplace la couleur enregistrée à chaque lancement. Utilisez les valeurs anglaises documentées. Une valeur invalide ou indisponible utilise le réglage enregistré, avec un avertissement. Laissez vide pour ne pas utiliser cette option.'
  artist_helper:
    name: 'Artiste depuis le tableau de bord (facultatif, Commons)'
    description: 'Identifiant d''une entrée input_select, select ou input_text, par exemple input_select.frame_gallery_artist. Sa valeur remplace l''artiste enregistré à chaque lancement. Une valeur invalide ou indisponible utilise le réglage enregistré, avec un avertissement. Laissez vide pour ne pas utiliser cette option.'
  log_level:
    name: 'Détail du journal'
    description: 'Option avancée : info (par défaut), ou debug pour consigner aussi les candidats examinés.'
  loading_timer:
    name: 'Minuteur de chargement du tableau de bord'
    description: 'Facultatif. Identifiant du minuteur de cette carte, par exemple timer.frame_gallery_run. Seul ce minuteur est annulé après le nettoyage, même sans résultat ou en cas d''annulation. Laissez vide pour désactiver ce retour. Sa durée reste la sécurité en cas d''arrêt brutal.'
  artwork_info_helper:
    name: 'Informations sur l''œuvre dans le tableau de bord'
    description: 'Facultatif. Entrée Texte dédiée, par exemple input_text.frame_gallery_artwork. Longueur minimale 0, maximale 255, sans valeur initiale. L''application y écrit le titre, l''artiste et la source de l''aperçu. N''utilisez pas une entrée de filtre. Laissez vide pour conserver la carte avec image seule.'
  background_mode:
    name: 'Mode arrière-plan (expérimental, facultatif)'
    description: 'Désactivé par défaut. Événements de l''œuvre actuelle après un nouvel envoi explicite ; aucune interrogation périodique ni reconnexion aveugle. Mettre à jour le script une fois. Démarrer seul ne contacte pas le TV. Les associations sont enregistrées même sans ce mode. Attention : une connexion en lecture peut réveiller le TV ; aucune garantie générale de modèle/firmware. Aucun assistant, intégration ou privilège supplémentaire.'
  resume_state_entity:
    name: 'Reprendre après la veille (expérimental, facultatif)'
    description: 'Vide : désactivé. Nécessite le mode arrière-plan et un ancien envoi réussi. Indiquez l''entité Samsung HA existante de ce TV (media_player ou remote). Une transition arrêt → marche récemment observée autorise une vérification en lecture, sans envoi d''image. Aucun essai au simple démarrage si le TV est déjà allumé, aucune répétition aveugle. HA marche ne prouve pas le mode Art. Effets de connexion non vérifiés : réveil ou changement de mode possibles. Aucun nouvel assistant ni privilège spécial.'
