    description: 'Entitäts-ID eines Dropdown- oder Text-Helfers, z. B. input_select.frame_gallery_source. Dessen Wert ersetzt die Bildquelle. Leer lassen, um die obige Einstellung zu nutzen.'
  department_helper:
    name: 'Sammlung vom Dashboard (optional)'
    description: 'Entitäts-ID eines Dropdown- oder Text-Helfers für die Cleveland-Sammlung. Leer lassen, um die obige Einstellung zu nutzen.'
  style_helper:
    name: 'Entstehungszeit vom Dashboard (optional)'
    description: 'Entitäts-ID eines Dropdown- oder Text-Helfers für die Entstehungszeit der Museumswerke. Leer lassen, um die obige Einstellung zu nutzen.'
  color_helper:
    name: 'Farbe vom Dashboard (optional, Commons)'
    description: 'Entitäts-ID eines Dropdown- oder Text-Helfers für eine einzelne Farbe. Für Commons funktionieren z. B. Blau, Blue oder color_blue. Leer lassen, um den obigen Farbwunsch zu nutzen. Andere Quellen wenden den Farbwunsch nicht an. Kein zusätzlicher Helfer erforderlich.'
  log_level:
    name: 'Protokolldetails (Expertenoption)'
    description: 'info ist Standard. debug protokolliert zusätzlich die geprüften Kandidaten. Für den normalen Betrieb nicht erforderlich.'
  loading_timer:
    name: 'Dashboard-Ladeanzeige (optional)'
    description: 'Entitäts-ID des zugehörigen Timers, z. B. timer.frame_gallery_run. Die App beendet dessen Ladeanzeige nach dem Aufräumen. Ohne Angabe ist der Timer-Ablauf die Absicherung.'
  artwork_info_helper:
    name: 'Künstler und Titel im Dashboard (optional)'
    description: 'Entitäts-ID eines Text-Helfers, z. B. input_text.frame_gallery_artwork. Mindestlänge 0, Maximallänge 255, kein Initialwert. Nicht denselben Helfer wie für Filter verwenden. Leer lassen für die reine Bildkarte.'
  color:
    name: 'Farbwunsch (Commons)'
    description: 'any bedeutet alle Farben. Für Commons eine Farbgruppe wählen: Sie muss einen sichtbaren Anteil am Werk haben (etwa 5 %), nicht zwingend die größte Fläche. Ocker/Gold kann als Gelb zählen. Andere Quellen wenden den Wunsch nicht an und melden das im Protokoll. Ohne Treffer bleibt das bisherige Werk; es gibt keinen Ersatz anderer Farbe.'
  artist:
    name: 'Künstlerwunsch (Commons, optional)'
    description: 'Leer lassen oder Alle Künstler für die gesamte Auswahl eintragen. Sonst einen angebotenen Namen aus der Künstler-Anleitung angeben, z. B. Wassily Kandinsky. Nur für Commons. Künstler und Farbe müssen beide passen; ohne Treffer bleibt das bisherige Werk erhalten.'
  artist_helper:
    name: 'Künstler vom Dashboard (optional, Commons)'
    description: 'Entitäts-ID eines Dropdown- oder Text-Helfers, z. B. input_select.frame_gallery_artist. Er ersetzt den Künstlerwunsch bei jedem Start. Ungültige oder nicht lesbare Werte fallen mit einer Warnung auf den gespeicherten Künstlerwunsch zurück.'
  background_mode:
    name: 'Hintergrundmodus (experimentell, optional)'
    description: 'Standardmäßig aus. Passive Ereignisse nach erfolgreichem ausdrücklichem Versand. Sicherheitsbremse: keine automatischen Start-/Minutenabfragen. Nur die NEUE Freigabe standby_resume erlaubt begrenzten Wiederanlauf nach stabilem Aufwachen. Sende-Script einmal aktualisieren; keine Sonderrechte. Nur die NEUE Freigabe confirm_current_artwork erlaubt Minutenprüfungen auf derselben Verbindung.'
  current_state_refresh:
    name: 'Regelmäßiger Abgleich (vorübergehend gesperrt)'
    description: 'Aus Kompatibilitätsgründen gespeichert, während der Sicherheitsbremse aber ohne Wirkung. Keine zeitgesteuerten Modus- oder Bild-ID-Abfragen. Nach dem ersten Nachweis nach Bildversand erneuern nur passiv empfangene vollständige Diashow-Ereignisse die Anzeige. Unveränderte oder unbestätigte Bilder können veralten; keine automatische Wiederherstellungsabfrage. Nur die NEUE Freigabe confirm_current_artwork erlaubt Minutenprüfungen auf derselben Verbindung.'
  resume_state_entity:
    name: 'Samsung-Zustandsentität (optional)'
    description: 'Vorhandene Samsung-ID (media_player oder remote). Aus/unbekannt/nicht verfügbar, Fehler oder Beobachtungslücke stoppen. Ohne standby_resume nur Stoppsignal. Mit der NEUEN Freigabe kann ein stabiler frischer Aus/An-Wechsel einen Leseversuch erlauben. HA an beweist keinen Kunstmodus.'
  standby_resume:
    name: 'Nach Standby fortsetzen (experimentell, separate Freigabe)'
    description: 'Standardmäßig AUS. Benötigt Hintergrundmodus und vorhandene Samsung-Zustandsentität. Nach 30 s durchgehend beobachtetem Aus und frischem, 10 s stabilem An genau ein Leseversuch. Max. 6/Stunde, mindestens 60 s Abstand, auch über Neustarts. Kein Startabruf, Wiederholungsversuch, Bild-/Power-/Modusbefehl oder Minutenabgleich. Schon die Verbindung kann den TV beeinflussen; keine Nichtaufweck-Garantie. Alte gespeicherte Schalter aktivieren dies nicht.'
  confirm_current_artwork:
    name: 'Unverändertes Kunstwerk bestätigen (experimentell, separate Freigabe)'
    description: 'Standardmäßig AUS. Benötigt Hintergrundmodus und vorhandene Samsung-Entität. Nur auf bereits bestätigter Art-Verbindung: höchstens eine konsistente Prüfung mit vier GETs/60 s. Keine neue Verbindung, Bild-/Power-/Modusbefehle oder Wiederholung. Aus/Menü/Standby, HA-Lücken oder Fehler stoppen. Alte Schalter aktivieren es nicht. Lesen kann Schlaf beeinflussen; keine physische Nichtaufweck-Garantie.'
