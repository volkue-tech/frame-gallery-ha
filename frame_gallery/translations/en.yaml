# Generated by scripts/app_config.py; do not edit (D-123, D-129).
configuration:
  tv_host:
    name: 'TV address'
    description: 'The IPv4 address of your Frame TV on your home network, for example 192.168.1.20. Only private home-network addresses are accepted. Give the TV a fixed address in your router (a DHCP reservation), so that it keeps this address.'
  source:
    name: 'Artwork source'
    description: 'wikimedia_commons (default for new installations): 1000 curated near-widescreen artworks; no API key. art_institute_chicago: Art Institute of Chicago. cleveland_museum_of_art: Cleveland Museum of Art. local_media: your JPEG/PNG files in frame_gallery/library in Home Assistant media.'
  department:
    name: 'Department (Cleveland only)'
    description: 'Only works from this department of the Cleveland Museum of Art; any means no filter. The Art Institute of Chicago and your own images do not support a department: with them, a department is not applied, and the log and the run record say so. Wikimedia Commons does not support a department filter either.'
  style:
    name: 'Period (both museums)'
    description: 'Only works created in this period: before 1400, 1400 to 1599, 1600 to 1799, 1800 to 1899, or 1900 and later; any means no filter. It applies to both museums, not to your own images. Art styles are not offered yet. Wikimedia Commons does not support a period filter either.'
  color:
    name: 'Colour wish (Commons)'
    description: 'any means all colours. For Commons, choose one colour family: it must occupy a noticeable part of the artwork (about 5 %), not necessarily the largest. Warm ochre/gold can match yellow. Other sources do not apply this wish and report it in the log. No match keeps the current artwork; another colour is never used as a fallback.'
  landscape_only:
    name: 'Landscape only'
    description: 'Only choose artworks that are wider than they are tall.'
  strict_tv_format:
    name: 'Prefer 16:9 (may take longer)'
    description: 'Prefer artworks within about 1 % of the TV''s 16:9 shape. If there is none, and Landscape only is on with the contain fit, another landscape artwork is shown whole, with margins. Commons sources are within 2.5 % of 16:9; turn this off to include the whole curated selection rather than prefer the closest matches.'
  fit_mode:
    name: 'Image fit (contain = no crop)'
    description: 'contain shows the whole artwork, with margins where its shape differs from the TV''s (nothing is cropped). cover fills the whole screen and may crop the edges.'
  background_color:
    name: 'Margin colour'
    description: 'The colour of the margins in contain mode, as #RRGGBB; black is #000000.'
  source_helper:
    name: 'Source helper'
    description: 'Optional. An input_select, select, or input_text helper whose state replaces the Artwork source option above at every start, for example input_select.frame_gallery_source. A value the helper cannot supply falls back to the option above, with a warning in the log. Leave empty to use only the option above.'
  department_helper:
    name: 'Department helper'
    description: 'Optional. An input_select, select, or input_text helper whose state replaces the Department option above at every start, for example input_select.frame_gallery_department. A value the helper cannot supply falls back to the option above, with a warning in the log. Leave empty to use only the option above.'
  style_helper:
    name: 'Period helper'
    description: 'Optional. An input_select, select, or input_text helper whose state replaces the Period option above at every start, for example input_select.frame_gallery_period. A value the helper cannot supply falls back to the option above, with a warning in the log. Leave empty to use only the option above.'
  color_helper:
    name: 'Colour helper'
    description: 'Optional. An input_select, select, or input_text helper whose state replaces the Colour option above at every start, for example input_select.frame_gallery_colour. A value the helper cannot supply falls back to the option above, with a warning in the log. Leave empty to use only the option above.'
  log_level:
    name: 'Log detail'
    description: 'Advanced: info (the default) or debug, which also logs each candidate the app considered.'
  loading_timer:
    name: 'Dashboard loading timer'
    description: 'Optional. This app''s dashboard timer, for example timer.frame_gallery_run. Only this timer is cancelled after cleanup, also on no-match and cancellation. Leave empty to disable feedback. Its duration remains the crash fail-safe.'
  artwork_info_helper:
    name: 'Dashboard artwork information'
    description: 'Optional. A dedicated Text helper, for example input_text.frame_gallery_artwork, with minimum length 0, maximum length 255 and no Initial value. The app writes title, artist and museum for the preview here. Do not use a filter helper. Leave empty to keep the existing image-only dashboard behavior.'
