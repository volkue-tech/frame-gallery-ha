# Generated by scripts/app_config.py; do not edit (D-123, D-129).
configuration:
  tv_host:
    name: 'TV address'
    description: 'The IPv4 address of your Frame TV on your home network, for example 192.168.1.20. Only private home-network addresses are accepted. Give the TV a fixed address in your router (a DHCP reservation), so that it keeps this address.'
  source:
    name: 'Artwork source'
    description: 'Where the artwork comes from: the Art Institute of Chicago (public-domain works), the Cleveland Museum of Art (open-access works), or local_media, your own JPEG and PNG images in the folder frame_gallery/library of Home Assistant''s media.'
  department:
    name: 'Department (Cleveland only)'
    description: 'Only works from this department of the Cleveland Museum of Art; any means no filter. The Art Institute of Chicago and your own images do not support a department: with them, a department is not applied, and the log and the run record say so.'
  style:
    name: 'Period (both museums)'
    description: 'Only works created in this period: before 1400, 1400 to 1599, 1600 to 1799, 1800 to 1899, or 1900 and later; any means no filter. It applies to both museums, not to your own images. Art styles are not offered yet.'
  color:
    name: Colour
    description: 'No source supports a colour filter yet, so the only choice is any.'
  landscape_only:
    name: 'Landscape only'
    description: 'Only choose artworks that are wider than they are tall.'
  strict_tv_format:
    name: 'Prefer the TV''s shape'
    description: 'Prefer artworks within about 1 % of the TV''s 16:9 shape. If there is none, and Landscape only is on with the contain fit, another landscape artwork is shown whole, with margins.'
  fit_mode:
    name: Fit
    description: 'contain shows the whole artwork, with margins where its shape differs from the TV''s (nothing is cropped). cover fills the whole screen and may crop the edges.'
  background_color:
    name: 'Margin colour'
    description: 'The colour of the margins in contain mode, as #RRGGBB; black is #000000.'
  source_helper:
    name: 'Source helper'
    description: 'Optional. An input_select, select, or input_text helper whose state replaces the Artwork source option above at every start, for example input_select.frame_gallery_source. A value the helper cannot supply falls back to the option above, with a warning in the log. Leave empty to use only the option above.'
  department_helper:
    name: 'Department helper'
    description: 'Optional. An input_select, select, or input_text helper whose state replaces the Department option above at every start, for example input_select.frame_gallery_department. A value the helper cannot supply falls back to the option above, with a warning in the log. Leave empty to use only the option above.'
  style_helper:
    name: 'Period helper'
    description: 'Optional. An input_select, select, or input_text helper whose state replaces the Period option above at every start, for example input_select.frame_gallery_period. A value the helper cannot supply falls back to the option above, with a warning in the log. Leave empty to use only the option above.'
  color_helper:
    name: 'Colour helper'
    description: 'Optional. An input_select, select, or input_text helper whose state replaces the Colour option above at every start, for example input_select.frame_gallery_colour. A value the helper cannot supply falls back to the option above, with a warning in the log. Leave empty to use only the option above.'
  log_level:
    name: 'Log detail'
    description: 'Advanced: info (the default) or debug, which also logs each candidate the app considered.'
