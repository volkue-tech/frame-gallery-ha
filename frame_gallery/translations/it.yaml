# Generated by scripts/app_config.py; do not edit (D-123, D-129).
configuration:
  tv_host:
    name: 'Indirizzo del televisore'
    description: 'Indirizzo IPv4 privato del tuo Frame TV, ad esempio 192.168.1.20. Riserva questo indirizzo nel router. I nomi host e gli indirizzi pubblici non sono accettati.'
  source:
    name: 'Fonte delle opere'
    description: 'wikimedia_commons (predefinita per le nuove installazioni): 1000 opere selezionate in formato quasi 16:9, senza chiave API. art_institute_chicago: Art Institute of Chicago. cleveland_museum_of_art: Cleveland Museum of Art. local_media: i tuoi file JPEG/PNG in frame_gallery/library, nei contenuti multimediali di Home Assistant.'
  color:
    name: 'Colore desiderato (Commons)'
    description: 'any significa tutti i colori. Scegli una famiglia presente in una parte visibile dell''opera (circa il 5 %), non necessariamente dominante. I valori restano in inglese: Red rosso, Orange arancione, Yellow giallo, Green verde, Blue blu, Purple viola, Pink rosa, Brown marrone, Beige beige, Gray grigio, Black nero, White bianco. Le altre fonti ignorano questo filtro e lo segnalano nel registro. Senza risultati rimane l''opera attuale.'
  artist:
    name: 'Artista desiderato (Commons, facoltativo)'
    description: 'Lascia vuoto oppure inserisci All artists per l''intera selezione. Altrimenti copia un nome disponibile dalla guida agli artisti, ad esempio Wassily Kandinsky. Solo per Commons. Devono corrispondere sia l''artista sia il colore; senza risultati rimane l''opera attuale, senza sostituire l''artista.'
  landscape_only:
    name: 'Solo formato orizzontale'
    description: 'Seleziona soltanto immagini più larghe che alte. Consigliato per un televisore orizzontale.'
  strict_tv_format:
    name: 'Preferisci 16:9 (può richiedere più tempo)'
    description: 'Preferisce opere entro circa l''1 % del formato 16:9. Se non ci sono risultati, con formato orizzontale e contain viene mostrata un''altra opera orizzontale intera con margini. La selezione Commons è entro il 2,5 % del 16:9; disattiva questa preferenza per includere tutta la selezione.'
  fit_mode:
    name: 'Adattamento dell''immagine (contain = senza ritaglio)'
    description: 'contain mostra tutta l''opera, con margini se necessari, senza ritagliarla. cover riempie lo schermo e può tagliare i bordi.'
  department:
    name: 'Dipartimento (solo Cleveland)'
    description: 'Seleziona un dipartimento del Cleveland Museum of Art; any significa nessun filtro. Le altre fonti non supportano questo filtro e lo segnalano nel registro e nel resoconto dell''esecuzione.'
  style:
    name: 'Periodo (entrambi i musei)'
    description: 'Seleziona il periodo di creazione: prima del 1400, dal 1400 al 1599, dal 1600 al 1799, dal 1800 al 1899 o dal 1900 in poi. any significa nessun filtro. Solo per entrambi i musei, non per Commons o i tuoi file. Gli stili artistici non sono ancora disponibili.'
  background_color:
    name: 'Colore dei margini'
    description: 'Colore dei margini in modalità contain, nel formato #RRGGBB. Il nero è #000000.'
  source_helper:
    name: 'Fonte dalla dashboard (facoltativo)'
    description: 'ID di un helper input_select, select o input_text, ad esempio input_select.frame_gallery_source. Il suo valore sostituisce la fonte salvata a ogni avvio. Un valore non valido o non disponibile usa la fonte salvata con un avviso. Lascia vuoto per non usare questa opzione.'
  department_helper:
    name: 'Dipartimento dalla dashboard (facoltativo)'
    description: 'ID di un helper input_select, select o input_text, ad esempio input_select.frame_gallery_department. Il suo valore sostituisce il dipartimento salvato a ogni avvio. Un valore non valido o non disponibile usa l''impostazione salvata con un avviso. Lascia vuoto per non usare questa opzione.'
  style_helper:
    name: 'Periodo dalla dashboard (facoltativo)'
    description: 'ID di un helper input_select, select o input_text, ad esempio input_select.frame_gallery_period. Il suo valore sostituisce il periodo salvato a ogni avvio. Un valore non valido o non disponibile usa l''impostazione salvata con un avviso. Lascia vuoto per non usare questa opzione.'
  color_helper:
    name: 'Colore dalla dashboard (facoltativo, Commons)'
    description: 'ID di un helper input_select, select o input_text, ad esempio input_select.frame_gallery_colour. Il suo valore sostituisce il colore salvato a ogni avvio. Usa i valori inglesi documentati. Un valore non valido o non disponibile usa l''impostazione salvata con un avviso. Lascia vuoto per non usare questa opzione.'
  artist_helper:
    name: 'Artista dalla dashboard (facoltativo, Commons)'
    description: 'ID di un helper input_select, select o input_text, ad esempio input_select.frame_gallery_artist. Il suo valore sostituisce l''artista salvato a ogni avvio. Un valore non valido o non disponibile usa l''impostazione salvata con un avviso. Lascia vuoto per non usare questa opzione.'
  log_level:
    name: 'Dettaglio del registro'
    description: 'Opzione avanzata: info (predefinito), oppure debug per registrare anche i candidati esaminati.'
  loading_timer:
    name: 'Timer di caricamento della dashboard'
    description: 'Facoltativo. ID del timer di questa scheda, ad esempio timer.frame_gallery_run. Solo questo timer viene annullato dopo la pulizia, anche senza risultati o in caso di annullamento. Lascia vuoto per disattivare questo riscontro. La durata resta la protezione in caso di arresto improvviso.'
  artwork_info_helper:
    name: 'Informazioni sull''opera nella dashboard'
    description: 'Facoltativo. Helper Testo dedicato, ad esempio input_text.frame_gallery_artwork. Lunghezza minima 0, massima 255, senza valore iniziale. L''app scrive il titolo, l''artista e la fonte dell''anteprima. Non usare un helper di filtro. Lascia vuoto per mantenere la scheda con la sola immagine.'
  background_mode:
    name: 'Modalità in background (sperimentale, facoltativa)'
    description: 'Disattivata per impostazione predefinita. Eventi passivi dopo un nuovo invio esplicito; aggiornare lo script una volta. Misura di sicurezza: nessuna connessione automatica all''avvio/risveglio né lettura periodica, anche con opzioni salvate. Le associazioni sono salvate anche senza questa modalità. Una connessione può avere effetti del firmware; nessuna garanzia generale di mancato risveglio. Nessun helper, integrazione o privilegio aggiuntivo.'
  current_state_refresh:
    name: 'Sincronizzazione periodica (temporaneamente sospesa)'
    description: 'Valore conservato per compatibilità, ma ignorato durante la misura di sicurezza. Nessuna lettura programmata di modalità o ID. Dopo la verifica iniziale successiva a un invio, solo gli eventi completi della presentazione ricevuti passivamente possono aggiornare l''opera. Le immagini invariate o non confermate possono scadere; nessuna richiesta automatica di recupero.'
  resume_state_entity:
    name: 'Stato Samsung (solo segnale di arresto, facoltativo)'
    description: 'Vuoto: omette questo segnale aggiuntivo. L''ID Samsung HA esistente (media_player o remote) viene conservato. Spento, sconosciuto, non disponibile, errore di lettura o interruzione di osservazione arresta il ricevitore. HA acceso non avvia né riprende mai una connessione TV; il recupero automatico è sospeso. HA acceso non prova la modalità Arte. Nessun nuovo helper o privilegio speciale.'
