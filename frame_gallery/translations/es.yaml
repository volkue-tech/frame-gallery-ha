# Generated by scripts/app_config.py; do not edit (D-123, D-129).
configuration:
  tv_host:
    name: 'Dirección del televisor'
    description: 'Dirección IPv4 privada de tu Frame TV, por ejemplo 192.168.1.20. Reserva esa dirección en el router. No se aceptan nombres de equipo ni direcciones públicas.'
  source:
    name: 'Fuente de las obras'
    description: 'wikimedia_commons (predeterminado en nuevas instalaciones): 1000 obras seleccionadas con formato casi 16:9, sin clave API. art_institute_chicago: Art Institute of Chicago. cleveland_museum_of_art: Cleveland Museum of Art. local_media: tus archivos JPEG/PNG en frame_gallery/library, dentro de los medios de Home Assistant.'
  color:
    name: 'Color deseado (Commons)'
    description: 'any significa todos los colores. Elige una familia presente en una parte visible de la obra (aproximadamente el 5 %), no necesariamente dominante. Los valores siguen en inglés: Red rojo, Orange naranja, Yellow amarillo, Green verde, Blue azul, Purple morado, Pink rosa, Brown marrón, Beige beige, Gray gris, Black negro, White blanco. Las otras fuentes ignoran este filtro y lo indican en el registro. Sin coincidencias, se mantiene la obra actual.'
  artist:
    name: 'Artista deseado (Commons, opcional)'
    description: 'Deja vacío o introduce All artists para toda la selección. De lo contrario, copia un nombre ofrecido en la guía de artistas, por ejemplo Wassily Kandinsky. Solo para Commons. Deben coincidir tanto el artista como el color; sin coincidencias se mantiene la obra actual, sin sustituir al artista.'
  landscape_only:
    name: 'Solo formato horizontal'
    description: 'Selecciona únicamente imágenes más anchas que altas. Recomendado para un televisor horizontal.'
  strict_tv_format:
    name: 'Preferir 16:9 (puede tardar más)'
    description: 'Prefiere obras con una desviación aproximada del 1 % respecto a 16:9. Si no hay ninguna, con formato horizontal y contain se muestra otra obra horizontal completa con márgenes. La selección Commons está dentro del 2,5 % de 16:9; desactiva esta preferencia para incluir toda la selección.'
  fit_mode:
    name: 'Ajuste de imagen (contain = sin recortar)'
    description: 'contain muestra toda la obra, con márgenes si son necesarios, sin recortarla. cover llena la pantalla y puede recortar los bordes.'
  department:
    name: 'Departamento (solo Cleveland)'
    description: 'Selecciona un departamento del Cleveland Museum of Art; any significa sin filtro. Las otras fuentes no admiten este filtro y lo indican en el registro y en el informe de ejecución.'
  style:
    name: 'Periodo (ambos museos)'
    description: 'Selecciona el periodo de creación: antes de 1400, de 1400 a 1599, de 1600 a 1799, de 1800 a 1899 o desde 1900. any significa sin filtro. Solo para ambos museos, no para Commons ni tus archivos. Todavía no se ofrecen estilos artísticos.'
  background_color:
    name: 'Color de los márgenes'
    description: 'Color de los márgenes en modo contain, con formato #RRGGBB. El negro es #000000.'
  source_helper:
    name: 'Fuente desde el panel (opcional)'
    description: 'ID de un ayudante input_select, select o input_text, por ejemplo input_select.frame_gallery_source. Su valor sustituye la fuente guardada en cada inicio. Un valor inválido o no disponible utiliza la fuente guardada con un aviso. Deja vacío para no usar esta opción.'
  department_helper:
    name: 'Departamento desde el panel (opcional)'
    description: 'ID de un ayudante input_select, select o input_text, por ejemplo input_select.frame_gallery_department. Su valor sustituye el departamento guardado en cada inicio. Un valor inválido o no disponible utiliza el ajuste guardado con un aviso. Deja vacío para no usar esta opción.'
  style_helper:
    name: 'Periodo desde el panel (opcional)'
    description: 'ID de un ayudante input_select, select o input_text, por ejemplo input_select.frame_gallery_period. Su valor sustituye el periodo guardado en cada inicio. Un valor inválido o no disponible utiliza el ajuste guardado con un aviso. Deja vacío para no usar esta opción.'
  color_helper:
    name: 'Color desde el panel (opcional, Commons)'
    description: 'ID de un ayudante input_select, select o input_text, por ejemplo input_select.frame_gallery_colour. Su valor sustituye el color guardado en cada inicio. Usa los valores ingleses documentados. Un valor inválido o no disponible utiliza el ajuste guardado con un aviso. Deja vacío para no usar esta opción.'
  artist_helper:
    name: 'Artista desde el panel (opcional, Commons)'
    description: 'ID de un ayudante input_select, select o input_text, por ejemplo input_select.frame_gallery_artist. Su valor sustituye el artista guardado en cada inicio. Un valor inválido o no disponible utiliza el ajuste guardado con un aviso. Deja vacío para no usar esta opción.'
  log_level:
    name: 'Detalle del registro'
    description: 'Opción avanzada: info (predeterminado), o debug para registrar también los candidatos examinados.'
  loading_timer:
    name: 'Temporizador de carga del panel'
    description: 'Opcional. ID del temporizador de esta tarjeta, por ejemplo timer.frame_gallery_run. Solo este temporizador se cancela tras la limpieza, también sin coincidencias o en caso de cancelación. Deja vacío para desactivar esta respuesta. Su duración mantiene la protección ante una interrupción inesperada.'
  artwork_info_helper:
    name: 'Información de la obra en el panel'
    description: 'Opcional. Ayudante Texto dedicado, por ejemplo input_text.frame_gallery_artwork. Longitud mínima 0, máxima 255, sin valor inicial. La aplicación escribe el título, el artista y la fuente de la vista previa. No uses un ayudante de filtro. Deja vacío para conservar la tarjeta con imagen solamente.'
  background_mode:
    name: 'Modo en segundo plano (experimental, opcional)'
    description: 'Desactivado por defecto. Eventos pasivos tras envío explícito correcto. Medida de seguridad: sin lecturas iniciales/periódicas. Solo el NUEVO permiso standby_resume permite recuperación limitada tras despertar estable. Sin permisos adicionales.'
  current_state_refresh:
    name: 'Sincronización periódica (suspendida temporalmente)'
    description: 'Valor conservado por compatibilidad, pero ignorado durante la medida de seguridad. Sin consultas programadas del modo o ID. Tras la prueba inicial posterior a un envío, solo los eventos completos de diapositivas recibidos pasivamente pueden actualizar la obra. Una imagen sin cambios o sin confirmar puede caducar; no hay consulta automática de recuperación.'
  resume_state_entity:
    name: 'Entidad de estado Samsung (opcional)'
    description: 'ID Samsung existente media_player o remote. Apagado/desconocido/no disponible/error o interrupción detiene el receptor. Sin standby_resume: solo señal de parada. Con el NUEVO permiso, una transición reciente y estable permite una lectura. HA encendido no demuestra modo Arte.'
  standby_resume:
    name: 'Reanudar tras espera (experimental, permiso separado)'
    description: 'Desactivado por defecto. Requiere modo en segundo plano y entidad Samsung existente. Tras 30 s de apagado observado sin interrupciones y un encendido reciente estable 10 s, permite una lectura. Máx. 6/h, separadas 60 s, incluso tras reinicios. Sin lectura inicial/periódica, reintentos ni órdenes de imagen/encendido/modo. La conexión puede afectar al TV; no se garantiza que no despierte. Los ajustes antiguos no lo activan.'
